# Configuration Netlify — vitrine DZ Wedding (site statique)

[build]
  publish = "."

# Cache long pour les polices (elles ne changent jamais)
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Raccourci de téléchargement : dzwedding.netlify.app/download
[[redirects]]
  from = "/download"
  to = "https://github.com/zinaimohamedali-lab/DZ-Wedding/releases/latest/download/DZWedding-Setup-1.0.exe"
  status = 302
  force = true
